[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lucena-plans"
version = "0.1.0"
description = "Position -> plan suggester + fact sheet: geometry-based chess coaching."
requires-python = ">=3.9"
dependencies = [
    "chess>=1.11",
]

[tool.setuptools]
package-dir = {"" = "src"}
# src layout: the library IS src/*.py. Everything else in
# the repo (research/experiments/, research/data/, research/gpu_benchmark/, the PGN banks) is the
# research harness and never ships. None of these modules roll an engine
# or Maia — the (fen, pvs, rolls) contract; rolled lines are the caller's
# to supply.
py-modules = [
    "closed_v0",
    "detectors",
    "fact_sheet",
    "plan_diff",
    "structures",
    "suggest",
    "tension",
    "verify",
    "weaknesses",
]
